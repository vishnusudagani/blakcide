# Builds the Astro landing and assembles dist/ (npm run build runs
# `astro build` then scripts/copy-subapps.mjs, which copies the static sub-apps
# app/, team-os/, symp-core/ into dist/). Publishing dist/ means the legacy root
# index.html/landing.css/script.js/style.css are no longer served — the Astro
# landing replaces them. Functions stay in netlify/functions, separate from dist.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Netlify secrets scanning flags the Supabase ANON key's value where it appears
  # in the published client JS (dist/app/*.js, team-os bundle). That key is PUBLIC
  # by design — it ships in the browser and is gated by Row-Level Security on the
  # database, not by secrecy. Without this omit, the scanner exits 2 and fails the
  # production git build (SUPABASE_ANON_KEY is defined only in the production
  # context, which is why deploy-preview builds passed while production builds
  # failed). The SERVICE_ROLE key is never in dist, so it stays scanned.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_ANON_KEY"

[functions]
  directory = "netlify/functions"

[dev]
  functions = "netlify/functions"
  targetPort = 8888

# ──────── Domain migration: blakcide.com → blaksyd.com ────────
# blaksyd.com is the canonical/primary domain; blakcide.com is the old one.
# These domain-level rules 301 every blakcide.com request (apex + www, any path)
# to the same path on blaksyd.com, preserving the path via :splat. They MUST stay
# at the top of the redirects list: the /api/* rules below match on path only
# (any host), so a blakcide.com/api/* request would hit them first unless the
# host-based redirect is evaluated first. `force = true` makes the redirect fire
# even when a matching file exists, so it always wins.
#
# These explicit rules are what perform the redirect: this site serves every
# attached domain at 200 (no automatic alias→primary redirect on Netlify here),
# so the rule is required, not just belt-and-suspenders. Both blakcide.com and
# blaksyd.com are attached to the site with DNS pointing at Netlify and a TLS cert
# covering both, so the redirect resolves cleanly to a valid https://blaksyd.com.
[[redirects]]
  from = "https://blakcide.com/*"
  to = "https://blaksyd.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.blakcide.com/*"
  to = "https://blaksyd.com/:splat"
  status = 301
  force = true

# Canonicalize www.blaksyd.com -> blaksyd.com so there is ONE auth origin. Without
# this, www.blaksyd.com is served at 200 (a separate origin with its own storage) and
# a Google login started there fails to persist a session on apex blaksyd.com. The
# apex blaksyd.com is the canonical host for auth.
[[redirects]]
  from = "https://www.blaksyd.com/*"
  to = "https://blaksyd.com/:splat"
  status = 301
  force = true

# Default crawler convention: many bots try /sitemap.xml before reading robots.txt.
# Astro emits /sitemap-index.xml, so rewrite /sitemap.xml to the generated index.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 200
  force = true

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/app"
  status = 200

[[redirects]]
  from = "/api/gemini-live-session"
  to = "/.netlify/functions/gemini-live-session"
  status = 200

[[redirects]]
  from = "/api/ice-servers"
  to = "/.netlify/functions/ice-servers"
  status = 200

[[redirects]]
  from = "/api/waitlist"
  to = "/.netlify/functions/waitlist"
  status = 200

# ──────── Team OS (React SPA built at /team-os) ────────
# Any deep link like /team-os/tasks/4 should serve the SPA's index.html
# so React Router can pick it up client-side.
[[redirects]]
  from = "/team-os/*"
  to = "/team-os/index.html"
  status = 200

# ──────── Retired blog posts → closest live page (301) ────────
# Three early posts were replaced in the brand-voice refresh; 301 their URLs so the
# links already submitted to search / IndexNow don't 404.
[[redirects]]
  from = "/blog/what-makes-a-good-listener"
  to = "/minit/"
  status = 301
[[redirects]]
  from = "/blog/an-app-that-wants-you-to-put-it-down"
  to = "/manifesto/"
  status = 301
[[redirects]]
  from = "/blog/anonymous-by-default"
  to = "/nexus/"
  status = 301
