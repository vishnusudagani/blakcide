# Builds the Astro landing and assembles dist/ (npm run build runs
# `astro build` then scripts/copy-subapps.mjs, which copies the static sub-apps
# app/, team-os/, symp-core/ into dist/). Publishing dist/ means the legacy root
# index.html/landing.css/script.js/style.css are no longer served — the Astro
# landing replaces them. Functions stay in netlify/functions, separate from dist.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Netlify secrets scanning flags the Supabase ANON key's value where it appears
  # in the published client JS (dist/app/*.js, team-os bundle). That key is PUBLIC
  # by design — it ships in the browser and is gated by Row-Level Security on the
  # database, not by secrecy. Without this omit, the scanner exits 2 and fails the
  # production git build (SUPABASE_ANON_KEY is defined only in the production
  # context, which is why deploy-preview builds passed while production builds
  # failed). The SERVICE_ROLE key is never in dist, so it stays scanned.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_ANON_KEY"

[functions]
  directory = "netlify/functions"

[dev]
  functions = "netlify/functions"
  targetPort = 8888

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/app"
  status = 200

[[redirects]]
  from = "/api/transcribe"
  to = "/.netlify/functions/transcribe"
  status = 200

[[redirects]]
  from = "/api/spotify-search"
  to = "/.netlify/functions/spotify-search"
  status = 200

[[redirects]]
  from = "/api/vision"
  to = "/.netlify/functions/vision"
  status = 200

[[redirects]]
  from = "/api/summarize"
  to = "/.netlify/functions/summarize"
  status = 200

[[redirects]]
  from = "/api/tts"
  to = "/.netlify/functions/tts"
  status = 200

[[redirects]]
  from = "/api/group-chat"
  to = "/.netlify/functions/group-chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/realtime-session"
  to = "/.netlify/functions/realtime-session"
  status = 200

[[redirects]]
  from = "/api/ice-servers"
  to = "/.netlify/functions/ice-servers"
  status = 200

[[redirects]]
  from = "/api/listener-copilot"
  to = "/.netlify/functions/listener-copilot"
  status = 200

[[redirects]]
  from = "/api/waitlist"
  to = "/.netlify/functions/waitlist"
  status = 200

# ──────── Team OS (React SPA built at /team-os) ────────
# Any deep link like /team-os/tasks/4 should serve the SPA's index.html
# so React Router can pick it up client-side.
[[redirects]]
  from = "/team-os/*"
  to = "/team-os/index.html"
  status = 200
