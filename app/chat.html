<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Blak · Blaksyd</title>
    <link rel="stylesheet" href="app-style.css">
    <link rel="stylesheet" href="blakcide-ui-v3.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600&display=swap" rel="stylesheet">
    <style>
        /* Sidebar is now full-height — no bottom nav offset needed */
        .chat-input-wrapper { margin-bottom: 0; }
        body { padding-bottom: 0 !important; }

        /* ── Persona picker ── */
        .persona-picker-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 999px;
            color: var(--text-1, #fff);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            white-space: nowrap;
            margin-right: 6px;
        }
        .persona-picker-btn:hover { background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.18); }
        .persona-picker-emoji { font-size: 1.05rem; line-height: 1; }
        .persona-picker-label { font-size: 0.85rem; }

        .persona-picker-menu {
            position: absolute;
            top: 56px;
            right: 16px;
            width: min(360px, 92vw);
            max-height: 70vh;
            overflow-y: auto;
            background: rgba(20, 20, 28, 0.96);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.55);
            z-index: 200;
            padding: 10px;
            color: var(--text-1, #fff);
            animation: persona-menu-in 0.18s ease-out;
        }
        @keyframes persona-menu-in {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .persona-picker-header {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(255,255,255,0.55);
            padding: 6px 10px 8px;
        }
        .persona-picker-footer {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.45);
            padding: 8px 10px 4px;
            border-top: 1px solid rgba(255,255,255,0.06);
            margin-top: 6px;
            font-style: italic;
        }
        .persona-picker-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.12s;
        }
        .persona-picker-item:hover { background: rgba(255,255,255,0.06); }
        .persona-picker-item.is-active {
            background: rgba(120, 130, 220, 0.18);
            border: 1px solid rgba(120, 130, 220, 0.4);
        }
        .persona-picker-item-emoji {
            font-size: 1.4rem;
            line-height: 1;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .persona-picker-item-body { flex: 1; min-width: 0; }
        .persona-picker-item-label {
            font-size: 0.92rem;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .persona-picker-item-oneliner {
            font-size: 0.78rem;
            color: rgba(255,255,255,0.62);
            line-height: 1.35;
        }
        .persona-picker-item-check {
            font-size: 1rem;
            color: rgb(140, 165, 255);
            flex-shrink: 0;
        }

        /* Toast for swap confirmation */
        .persona-swap-toast {
            position: fixed;
            top: 72px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(120, 130, 220, 0.95);
            color: white;
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 300;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            animation: toast-in 0.2s ease-out;
        }
        @keyframes toast-in {
            from { opacity: 0; transform: translateX(-50%) translateY(-8px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <link rel="stylesheet" href="blaksyd-pulse.css?v=20260428b">
</head>
<body class="dark-mode" data-page="chat">

<canvas id="pearl-canvas"></canvas>
<div id="toast-container" class="toast-container"></div>

<div id="sanctuary-app" class="app-layout active">

    <div id="mobile-overlay" class="mobile-overlay"></div>

    <!-- ── SIDEBAR ── -->
    <aside class="sidebar glass-panel" id="main-sidebar">
        <div class="sidebar-header">
            <button id="home-btn" class="brand-small-btn" style="display:inline-flex;align-items:center;">
                <img src="blaksyd-logo-white.png" alt="Blaksyd" style="height:22px;width:auto;max-width:110px;object-fit:contain;display:block;">
            </button>
            <button id="toggle-sidebar-btn" class="collapse-btn">
                <ion-icon name="chevron-back"></ion-icon>
            </button>
        </div>

        <!-- Tools -->
        <div class="sidebar-tools">
            <button id="nav-dashboard-btn" class="tool-btn" title="Home"><ion-icon name="home-outline"></ion-icon></button>
            <button id="new-chat-btn"       class="tool-btn" title="New Chat"><ion-icon name="add"></ion-icon></button>
            <button id="new-folder-btn"     class="tool-btn" title="New Folder"><ion-icon name="folder-open-outline"></ion-icon></button>
        </div>

        <!-- Search -->
        <div class="sidebar-search">
            <ion-icon name="search-outline"></ion-icon>
            <input type="text" id="ripple-search" placeholder="Search chats…" autocomplete="off">
        </div>

        <div id="view-title" class="view-title" style="display:none;"></div>
        <div class="history-list" id="history-list"></div>

        <!-- Spacer -->
        <div class="sidebar-spacer"></div>
        <div class="sidebar-divider"></div>

        <!-- Cross-page navigation -->
        <div class="sidebar-section-label">Navigate</div>
        <nav class="sidebar-nav-section">
            <a class="snav-item" href="dashboard.html">
                <ion-icon name="home-outline"></ion-icon><span>Home</span>
            </a>
            <a class="snav-item active" href="chat.html">
                <ion-icon name="sparkles-outline"></ion-icon><span>Blak</span>
            </a>
            <a class="snav-item" href="journal.html">
                <ion-icon name="book-outline"></ion-icon><span>Journal</span>
            </a>
            <a class="snav-item" href="connect.html">
                <ion-icon name="people-outline"></ion-icon><span>Listeners</span>
            </a>
            <a class="snav-item" href="nexus.html">
                <ion-icon name="planet-outline"></ion-icon><span>Nexus</span>
            </a>
        </nav>

        <div class="sidebar-divider"></div>

        <!-- Theme toggle -->
        <button class="theme-toggle-btn">
            <ion-icon name="sunny-outline"></ion-icon><span>Light mode</span>
        </button>

        <!-- User footer — single profile entry point -->
        <div class="user-profile glass-panel-inner" id="open-profile-btn"
             onclick="document.getElementById('global-profile-modal').style.display='flex'">
            <img id="sidebar-avatar" class="avatar-circle global-avatar" style="display:none;">
            <div id="sidebar-avatar-placeholder" class="avatar-circle-placeholder">
                <ion-icon name="person"></ion-icon>
            </div>
            <div class="user-info">
                <span id="user-name-display"  class="user-name global-name">User</span>
                <span id="user-email-display" class="user-email">…</span>
            </div>
            <button id="logout-btn" class="logout-link" title="Logout"
                    onclick="event.stopPropagation(); window.universalLogout && window.universalLogout()">
                <ion-icon name="log-out-outline"></ion-icon>
            </button>
        </div>
    </aside>

    <!-- ── CHAT MAIN ── -->
    <section class="chat-main">
        <!-- Mobile header -->
        <div class="mobile-top-header">
            <button id="mobile-menu-btn" class="mobile-menu-btn">
                <ion-icon name="menu-outline"></ion-icon>
            </button>
            <span class="mobile-chat-title" id="mobile-chat-title">Blak</span>
            <!-- Persona picker — click to swap mode (or just say "be my astrologer" mid-chat) -->
            <button id="persona-picker-btn" class="persona-picker-btn" title="Choose mode"
                onclick="window.togglePersonaPicker && window.togglePersonaPicker()">
                <span class="persona-picker-emoji" id="persona-picker-emoji">🧑‍🤝‍🧑</span>
                <span class="persona-picker-label" id="persona-picker-label">Friend</span>
                <ion-icon name="chevron-down-outline" style="font-size:0.8rem;opacity:0.7;"></ion-icon>
            </button>
            <a id="invite-friend-btn" class="invite-friend-btn v3-press"
                href="group-chat.html"
                title="Invite a friend — Blak mediates between you both">
                <ion-icon name="person-add-outline"></ion-icon>
                <span class="invite-friend-label">Invite friend</span>
            </a>
            <button id="ai-call-trigger-btn" class="ai-call-trigger-btn"
                title="Start AI Voice Call"
                onclick="window.startAICall && window.startAICall()">
                <ion-icon name="call-outline"></ion-icon>
            </button>
        </div>

        <!-- Persona picker dropdown — populated by app.js -->
        <div id="persona-picker-menu" class="persona-picker-menu" hidden>
            <div class="persona-picker-header">Choose your companion</div>
            <div id="persona-picker-list" class="persona-picker-list"></div>
            <div class="persona-picker-footer">
                or just say it mid-chat — "be my astrologer", "talk like a therapist"
            </div>
        </div>

        <!-- Chat messages -->
        <div id="chat-feed" class="chat-feed"></div>

        <!-- Input -->
        <form id="chat-form" class="chat-input-wrapper">
            <div class="input-glass-container">
                <button type="button" id="voice-btn" class="voice-btn-icon" title="Voice note">
                    <ion-icon name="mic-outline"></ion-icon>
                </button>
                <button type="button" id="chat-attach-btn" class="voice-btn-icon" title="Attach image">
                    <ion-icon name="image-outline"></ion-icon>
                </button>
                <input type="file" id="chat-image-input" accept="image/*" hidden>
                <input type="text" id="chat-input" placeholder="Message…" autocomplete="off">
                <button type="button" id="chat-journal-btn" class="voice-btn-icon" title="Save chat to Journal" style="opacity:0.55;">
                    <ion-icon name="book-outline"></ion-icon>
                </button>
                <button type="submit" class="send-btn-icon" title="Send">
                    <ion-icon name="arrow-up-outline"></ion-icon>
                </button>
            </div>
        </form>
    </section>

    <!-- ── VAULT PIN ── -->
    <div id="pin-modal" class="overlay-glass">
        <div class="glass-pane" style="max-width:340px;text-align:center;">
            <h2 class="serif-header"><ion-icon name="lock-closed"></ion-icon> Vault</h2>
            <p id="pin-msg" class="pin-msg" style="color:var(--text-2);font-size:0.88rem;margin-bottom:18px;">Enter 4-digit PIN</p>
            <input type="password" id="pin-input" class="minimal-input pin-box" maxlength="4" autocomplete="off" placeholder="••••">
            <div class="modal-actions">
                <button id="pin-cancel"  class="btn-glass">Cancel</button>
                <button id="pin-confirm" class="btn-solid">Unlock</button>
            </div>
        </div>
    </div>

    <!-- ── CHANGE PIN ── -->
    <div id="change-pin-modal" class="overlay-glass">
        <div class="glass-pane" style="max-width:340px;text-align:center;">
            <h2 class="serif-header"><ion-icon name="key"></ion-icon> Change PIN</h2>
            <input type="password" id="old-pin-input" class="minimal-input pin-box" maxlength="4" autocomplete="off" placeholder="Old PIN">
            <input type="password" id="new-pin-input" class="minimal-input pin-box" maxlength="4" autocomplete="off" placeholder="New PIN">
            <div class="modal-actions">
                <button id="change-pin-cancel"  class="btn-glass">Cancel</button>
                <button id="change-pin-confirm" class="btn-solid">Save</button>
            </div>
        </div>
    </div>

    <!-- ── CONTEXT MENU ── -->
    <div id="context-menu" class="glass-context-menu">
        <button id="cm-rename"><ion-icon name="pencil"></ion-icon> Rename</button>
        <button id="cm-vault" ><ion-icon name="lock-closed"></ion-icon> Send to Vault</button>
        <button id="cm-archive"><ion-icon name="archive"></ion-icon> Archive</button>
        <button id="cm-delete" class="danger-text"><ion-icon name="trash"></ion-icon> Delete</button>
    </div>

    <!-- ── PROFILE MODAL ── -->
    <div id="profile-modal" class="overlay-glass">
        <div class="glass-pane profile-pane-wide">
            <button id="close-profile-btn" class="profile-close">✕</button>
            <div class="profile-split-layout">
                <div class="profile-left">
                    <h2 class="serif-header left-align" style="font-size:1.3rem;">Your Profile</h2>
                    <p class="poetic-desc">Manage your account and secure your vault.</p>
                    <div class="glowing-avatar" onclick="document.getElementById('avatar-upload').click()">
                        <img id="profile-preview" class="profile-preview-img" style="display:none;">
                        <div id="profile-placeholder" class="profile-preview-placeholder">
                            <ion-icon name="person"></ion-icon>
                        </div>
                        <div class="upload-overlay"><ion-icon name="camera-outline"></ion-icon></div>
                    </div>
                    <input type="file" id="avatar-upload" hidden accept="image/*">
                </div>
                <div class="profile-right">
                    <form id="profile-form" class="profile-form">
                        <div class="input-group">
                            <label class="elegant-label">Name</label>
                            <input type="text" id="profile-name" class="minimal-input" placeholder="Your name…" style="margin-bottom:0;">
                        </div>
                        <div class="input-group">
                            <label class="elegant-label">Bio</label>
                            <textarea id="profile-bio" class="minimal-input textarea-input" placeholder="A short bio…" style="margin-bottom:0;min-height:80px;"></textarea>
                        </div>
                        <div class="security-divider"></div>
                        <label class="elegant-label">Security</label>
                        <button type="button" id="open-change-pin-btn" class="btn-glass slim-btn">Change Vault Passcode</button>
                        <button type="submit" class="btn-solid luxury-btn">Save Profile</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- ── INPUT MODAL ── -->
    <div id="input-modal" class="overlay-glass">
        <div class="glass-pane" style="max-width:360px;">
            <h2 id="modal-title" class="serif-header" style="font-size:1.2rem;">Input</h2>
            <input type="text" id="modal-input" class="minimal-input" autocomplete="off">
            <div class="modal-actions">
                <button id="modal-cancel"  class="btn-glass">Cancel</button>
                <button id="modal-confirm" class="btn-solid">Confirm</button>
            </div>
        </div>
    </div>

</div>

<!-- ── AI VOICE CALL OVERLAY ── -->
<div id="ai-call-overlay">
    <div style="position:absolute;inset:0;overflow:hidden;pointer-events:none;display:flex;align-items:center;justify-content:center;">
        <div class="ai-call-ring ai-call-ring-1"></div>
        <div class="ai-call-ring ai-call-ring-2"></div>
        <div class="ai-call-ring ai-call-ring-3"></div>
    </div>
    <div class="ai-call-avatar" id="ai-call-avatar-el">
        <span style="font-size:2.4rem;color:var(--accent);opacity:0.8;">✦</span>
    </div>
    <div class="ai-call-name">Blak</div>
    <div class="ai-call-status" id="ai-call-status">Connecting…</div>
    <div class="ai-call-timer"  id="ai-call-timer">0:00</div>
    <div id="ai-call-transcript"></div>
    <div class="ai-call-controls">
        <button class="ai-call-btn" id="ai-call-mute-btn"    onclick="window.toggleAICallMute()"    title="Mute">
            <ion-icon name="mic-outline"></ion-icon>
        </button>
        <button class="ai-call-end-btn" onclick="window.endAICall()" title="End call">
            <ion-icon name="call-outline" style="transform:rotate(135deg);"></ion-icon>
        </button>
        <button class="ai-call-btn" id="ai-call-speaker-btn" onclick="window.toggleAICallSpeaker()" title="Speaker">
            <ion-icon name="volume-high-outline"></ion-icon>
        </button>
    </div>
</div>

<script src="/symp-core/contract/endpoints.js"></script>
<script src="/symp-core/sdk/symp-client.js"></script>
<script src="blakcide-ui-v3.js?v=20260428b"></script>
<script src="sidebar-common.js"></script>
<script src="ai-service.js?v=20260428b"></script>
<script src="app.js?v=20260428b"></script>
<script src="spotify-auth.js"></script>
<script src="profile-manager.js?v=20260428b"></script>
<script src="nav-bar.js"></script>
<script src="blaksyd-pulse.js?v=20260428b"></script>
<!-- Pulse auto-trigger removed: no unsolicited timed modal mid-conversation. -->

</body>
</html>
