<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nexus – Blaksyd</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app-style.css">
    <link rel="stylesheet" href="blakcide-ui-v3.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/symp-core/contract/endpoints.js"></script>

    <style>
        html, body {
            height: 100dvh;
            background: var(--bg);
            overflow: hidden;
        }

        /* Two-column layout */
        .nx-layout {
            display: flex;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
        }
        .nx-main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top bar */
        .nx-topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 18px;
            background: var(--surface-1);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 10;
        }
        .nx-topbar-back {
            display: flex; align-items: center; gap: 6px;
            background: none; border: none; cursor: pointer;
            color: var(--text-2); font-size: 0.88rem; font-weight: 600;
            padding: 8px 10px 8px 4px; border-radius: 10px;
            font-family: inherit; -webkit-tap-highlight-color: transparent;
            transition: color 0.18s;
        }
        .nx-topbar-back:hover { color: var(--text); }
        .nx-topbar-back ion-icon { font-size: 1.2rem; }
        .nx-topbar-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.05rem; font-weight: 500;
            font-style: italic; letter-spacing: 0.3px;
            display: flex; align-items: center; gap: 8px;
        }
        .nx-topbar-title img { height: 20px; width: auto; max-width: 90px; object-fit: contain; display: block; }

        /* Communities strip */
        .nx-comm-strip {
            display: flex; gap: 8px; padding: 12px 18px;
            overflow-x: auto; -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            background: var(--surface-1);
        }
        .nx-comm-strip::-webkit-scrollbar { display: none; }
        .nx-comm-chip {
            flex-shrink: 0;
            padding: 9px 16px; border-radius: 999px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
            color: var(--text-2);
            font-size: 0.84rem; font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.18s, border-color 0.18s, color 0.18s, transform 0.12s;
            -webkit-tap-highlight-color: transparent;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .nx-comm-chip:hover { background: rgba(255,255,255,0.06); color: var(--text); }
        .nx-comm-chip.active {
            background: linear-gradient(135deg, rgba(0,240,192,0.18), rgba(176,115,255,0.14));
            border-color: rgba(0,240,192,0.45);
            color: var(--text);
            box-shadow: 0 4px 14px rgba(0,240,192,0.18);
        }
        .nx-comm-chip .nx-eph {
            font-size: 0.62rem; padding: 2px 6px; border-radius: 6px;
            background: rgba(255,179,51,0.14); color: #ffb733;
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        /* Feed */
        .nx-feed {
            flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
            padding: 16px 0 24px;
            min-height: 0;
        }
        .nx-feed-inner {
            max-width: 720px; margin: 0 auto;
            padding: 0 18px;
            display: flex; flex-direction: column; gap: 12px;
        }

        /* Community header card */
        .nx-comm-hero {
            padding: 22px 22px 18px;
            border-radius: 22px;
            background:
                radial-gradient(120% 90% at 0% 0%, rgba(0,240,192,0.12) 0%, transparent 55%),
                radial-gradient(100% 100% at 100% 100%, rgba(176,115,255,0.10) 0%, transparent 60%),
                rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .nx-comm-hero h1 {
            margin: 0 0 6px;
            font-family: 'Playfair Display', serif;
            font-weight: 500; font-size: 1.5rem; letter-spacing: -0.01em;
        }
        .nx-comm-hero p {
            margin: 0; color: var(--text-2);
            font-size: 0.88rem; line-height: 1.55;
        }
        .nx-comm-meta {
            display: flex; gap: 14px; margin-top: 12px;
            font-size: 0.74rem; color: var(--text-3);
        }
        .nx-comm-meta span ion-icon {
            font-size: 0.85rem; vertical-align: -2px; margin-right: 3px;
        }

        /* Post card */
        .nx-post {
            padding: 16px 18px;
            border-radius: 18px;
            background: rgba(255,255,255,0.025);
            border: 1px solid rgba(255,255,255,0.06);
            transition: background 0.18s, border-color 0.18s, transform 0.18s;
        }
        .nx-post:hover {
            background: rgba(255,255,255,0.04);
            border-color: rgba(255,255,255,0.10);
        }
        .nx-post.is-ai {
            background: linear-gradient(135deg, rgba(176,115,255,0.06), rgba(0,240,192,0.04));
            border-color: rgba(176,115,255,0.22);
        }
        .nx-post.soft-hidden {
            opacity: 0.55;
            background: rgba(255,125,160,0.05);
            border-color: rgba(255,125,160,0.18);
        }

        .nx-post-head {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 10px;
        }
        .nx-handle-avatar {
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 0.72rem;
            color: #04221c;
            flex-shrink: 0;
        }
        .nx-handle-name {
            font-size: 0.85rem; font-weight: 700;
            display: flex; align-items: center; gap: 6px;
        }
        .nx-ai-badge {
            font-size: 0.6rem; font-weight: 700;
            padding: 2px 7px; border-radius: 6px;
            background: linear-gradient(135deg, #b073ff, #5ab1ff);
            color: #fff; letter-spacing: 0.6px;
            text-transform: uppercase;
        }
        .nx-post-time {
            margin-left: auto; font-size: 0.72rem; color: var(--text-3);
        }
        .nx-resonance {
            font-size: 0.7rem; font-weight: 700;
            padding: 3px 8px; border-radius: 999px;
            background: rgba(0,240,192,0.10);
            border: 1px solid rgba(0,240,192,0.25);
            color: #00f0c0;
            letter-spacing: 0.3px;
        }

        .nx-post-title {
            font-size: 1.02rem; font-weight: 700;
            line-height: 1.3; margin-bottom: 4px;
        }
        .nx-post-body {
            font-size: 0.92rem; color: var(--text);
            line-height: 1.55; white-space: pre-wrap;
            margin-bottom: 12px;
        }

        /* Impact row */
        .nx-impact-row {
            display: flex; gap: 6px; flex-wrap: wrap;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.04);
        }
        .nx-impact-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 11px; border-radius: 999px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.07);
            color: var(--text-2);
            font-size: 0.77rem; font-weight: 600;
            cursor: pointer; font-family: inherit;
            transition: background 0.18s, border-color 0.18s, transform 0.12s, color 0.18s;
            -webkit-tap-highlight-color: transparent;
        }
        .nx-impact-btn:hover {
            background: rgba(255,255,255,0.04);
            border-color: rgba(255,255,255,0.16);
            color: var(--text);
        }
        .nx-impact-btn:active { transform: scale(0.96); }
        .nx-impact-btn.given {
            background: rgba(0,240,192,0.10);
            border-color: rgba(0,240,192,0.4);
            color: #00f0c0;
        }
        .nx-impact-btn .nx-impact-emoji { font-size: 0.92rem; }

        .nx-comments-toggle {
            margin-left: auto;
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 11px; border-radius: 999px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.07);
            color: var(--text-2);
            font-size: 0.77rem; font-weight: 600;
            cursor: pointer; font-family: inherit;
            transition: background 0.18s, color 0.18s;
        }
        .nx-comments-toggle:hover { color: var(--text); background: rgba(255,255,255,0.04); }

        /* Comments inline */
        .nx-comments {
            margin-top: 14px; padding-top: 14px;
            border-top: 1px dashed rgba(255,255,255,0.07);
            display: none;
        }
        .nx-comments.open { display: block; }
        .nx-comment {
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(255,255,255,0.025);
            margin-bottom: 8px;
        }
        .nx-comment.is-ai {
            background: linear-gradient(135deg, rgba(176,115,255,0.06), rgba(90,177,255,0.04));
            border-left: 2px solid rgba(176,115,255,0.5);
        }
        .nx-comment-head {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 4px;
            font-size: 0.78rem; font-weight: 700;
        }
        .nx-comment-time { margin-left: auto; font-size: 0.68rem; color: var(--text-3); font-weight: 500; }
        .nx-comment-body {
            font-size: 0.86rem; color: var(--text);
            line-height: 1.5; white-space: pre-wrap;
        }

        .nx-comment-composer {
            display: flex; gap: 8px; margin-top: 10px;
        }
        .nx-comment-composer input {
            flex: 1; padding: 9px 12px; border-radius: 10px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            color: #fff; font-size: 0.85rem; font-family: inherit; outline: none;
            transition: border-color 0.18s;
        }
        .nx-comment-composer input:focus { border-color: rgba(0,240,192,0.5); }
        .nx-comment-composer button {
            padding: 9px 14px; border-radius: 10px;
            background: var(--accent, #00f0c0);
            color: #04221c; border: none; cursor: pointer;
            font-weight: 700; font-size: 0.85rem; font-family: inherit;
            transition: transform 0.12s;
        }
        .nx-comment-composer button:active { transform: scale(0.96); }
        .nx-comment-composer button:disabled { opacity: 0.5; cursor: wait; }

        /* Empty / loading */
        .nx-empty {
            text-align: center; padding: 60px 20px;
            color: var(--text-3);
        }
        .nx-empty ion-icon { font-size: 2.5rem; opacity: 0.4; display: block; margin-bottom: 12px; }
        .nx-empty .nx-empty-title { font-size: 1rem; font-weight: 700; color: var(--text-2); margin-bottom: 6px; }

        /* Composer (flow-anchored bottom of nx-main column) */
        .nx-composer {
            flex-shrink: 0;
            padding: 14px 18px calc(14px + env(safe-area-inset-bottom, 0px));
            background: linear-gradient(180deg, transparent, rgba(8,11,15,0.92) 28%);
            backdrop-filter: blur(22px) saturate(150%);
            -webkit-backdrop-filter: blur(22px) saturate(150%);
            border-top: 1px solid rgba(255,255,255,0.04);
        }
        .nx-composer-inner {
            max-width: 720px; margin: 0 auto;
            display: flex; flex-direction: column; gap: 8px;
            background: rgba(20, 23, 32, 0.92);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 12px;
        }
        .nx-composer-inner input.nx-comp-title {
            padding: 10px 12px; border-radius: 10px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            color: #fff; font-size: 0.92rem; font-family: inherit; outline: none;
            font-weight: 600;
        }
        .nx-composer-inner textarea {
            padding: 10px 12px; border-radius: 10px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            color: #fff; font-size: 0.92rem; font-family: inherit;
            outline: none; resize: none; min-height: 56px; max-height: 160px;
            line-height: 1.5;
        }
        .nx-composer-inner input:focus,
        .nx-composer-inner textarea:focus { border-color: rgba(0,240,192,0.5); }
        .nx-comp-actions {
            display: flex; align-items: center; gap: 10px;
        }
        .nx-comp-hint { font-size: 0.72rem; color: var(--text-3); flex: 1; }
        .nx-comp-send {
            padding: 10px 18px; border-radius: 10px;
            background: linear-gradient(135deg, #00f0c0, #5ab1ff);
            color: #04221c; border: none; cursor: pointer;
            font-weight: 800; font-size: 0.86rem; font-family: inherit;
            display: inline-flex; align-items: center; gap: 6px;
            transition: transform 0.12s, box-shadow 0.18s;
            box-shadow: 0 6px 16px rgba(0,240,192,0.25);
        }
        .nx-comp-send:active { transform: scale(0.97); }
        .nx-comp-send:disabled { opacity: 0.55; cursor: wait; }

        /* Sign-in fallback */
        .nx-need-auth {
            padding: 28px 24px;
            border-radius: 18px;
            background: rgba(255,179,51,0.06);
            border: 1px solid rgba(255,179,51,0.18);
            text-align: center; margin: 22px;
        }
        .nx-need-auth a {
            display: inline-block; margin-top: 10px;
            padding: 9px 18px; border-radius: 10px;
            background: #ffb733; color: #1a1300;
            text-decoration: none; font-weight: 700; font-size: 0.88rem;
        }

        /* Mobile */
        @media (max-width: 720px) {
            .nx-topbar-title { font-size: 0.95rem; }
            .nx-comm-hero h1 { font-size: 1.25rem; }
            .nx-post-title { font-size: 0.96rem; }
            .nx-impact-btn { font-size: 0.74rem; padding: 5px 9px; }
        }

        /* ── New-community chip + modal ───────────────────────────────── */
        .nx-comm-new {
            flex-shrink: 0;
            display: inline-flex; align-items: center; gap: 6px;
            padding: 9px 14px; border-radius: 999px;
            background: linear-gradient(135deg, rgba(0,240,192,0.18), rgba(176,115,255,0.16));
            border: 1px dashed rgba(0,240,192,0.55);
            color: var(--text);
            font-size: 0.84rem; font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            white-space: nowrap;
            transition: transform 0.12s, background 0.18s, box-shadow 0.18s;
            -webkit-tap-highlight-color: transparent;
        }
        .nx-comm-new:hover {
            background: linear-gradient(135deg, rgba(0,240,192,0.28), rgba(176,115,255,0.24));
            box-shadow: 0 4px 14px rgba(0,240,192,0.25);
            transform: translateY(-1px);
        }
        .nx-comm-new ion-icon { font-size: 1rem; }

        .nx-modal {
            position: fixed; inset: 0;
            background: rgba(8,10,16,0.66);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999;
            animation: nxFade 0.18s ease;
            padding: 18px;
        }
        @keyframes nxFade { from { opacity: 0; } to { opacity: 1; } }
        .nx-modal-card {
            width: 100%; max-width: 460px;
            background: var(--surface-1, #15171f);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
            animation: nxRise 0.32s cubic-bezier(0.2,0.9,0.3,1.2);
        }
        @keyframes nxRise {
            from { transform: translateY(18px) scale(0.97); opacity: 0; }
            to   { transform: translateY(0) scale(1); opacity: 1; }
        }
        .nx-modal-hero {
            position: relative;
            padding: 22px 22px 18px;
            background:
              radial-gradient(circle at 20% 0%, rgba(0,240,192,0.22), transparent 55%),
              radial-gradient(circle at 90% 110%, rgba(176,115,255,0.22), transparent 55%),
              radial-gradient(circle at 60% 50%, rgba(255,138,138,0.12), transparent 55%);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .nx-modal-hero h2 {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.4rem;
            margin: 0 0 4px; color: var(--text);
            font-weight: 500;
        }
        .nx-modal-hero p {
            margin: 0; font-size: 0.86rem;
            color: var(--text-2);
            line-height: 1.45;
        }
        .nx-modal-close {
            position: absolute; top: 14px; right: 14px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--text-2);
            width: 32px; height: 32px; border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.18s, color 0.18s, transform 0.12s;
        }
        .nx-modal-close:hover { background: rgba(255,255,255,0.08); color: var(--text); transform: scale(1.06); }
        .nx-modal-body {
            padding: 18px 22px 8px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .nx-modal-body label {
            font-size: 0.78rem; font-weight: 700;
            color: var(--text-2);
            text-transform: uppercase; letter-spacing: 0.5px;
            margin-bottom: -6px;
        }
        .nx-modal-body input,
        .nx-modal-body textarea {
            width: 100%;
            padding: 11px 13px;
            border-radius: 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--text);
            font-size: 0.92rem;
            font-family: inherit;
            transition: border-color 0.18s, background 0.18s;
            box-sizing: border-box;
        }
        .nx-modal-body textarea {
            resize: vertical;
            min-height: 76px;
            line-height: 1.5;
        }
        .nx-modal-body input:focus,
        .nx-modal-body textarea:focus {
            outline: none;
            border-color: rgba(0,240,192,0.55);
            background: rgba(0,240,192,0.05);
        }
        .nx-modal-slug-hint {
            font-size: 0.74rem; color: var(--text-3); margin: -6px 0 0;
        }
        .nx-modal-slug-hint strong { color: rgba(0,240,192,0.9); font-weight: 700; }
        .nx-modal-foot {
            padding: 14px 22px 22px;
            display: flex; justify-content: flex-end; gap: 10px;
        }
        .nx-modal-cancel,
        .nx-modal-create {
            border: none; cursor: pointer;
            padding: 11px 18px;
            border-radius: 12px;
            font-family: inherit; font-weight: 700; font-size: 0.9rem;
            transition: transform 0.12s, box-shadow 0.18s, opacity 0.18s;
            -webkit-tap-highlight-color: transparent;
        }
        .nx-modal-cancel {
            background: rgba(255,255,255,0.04);
            color: var(--text-2);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .nx-modal-cancel:hover { background: rgba(255,255,255,0.08); color: var(--text); }
        .nx-modal-create {
            background: linear-gradient(135deg, #00f0c0, #4d8dff);
            color: #06121a;
            box-shadow: 0 8px 24px rgba(0,240,192,0.3);
        }
        .nx-modal-create:hover { transform: translateY(-1px); box-shadow: 0 10px 28px rgba(0,240,192,0.4); }
        .nx-modal-create:disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: none; }
        .nx-modal-error {
            font-size: 0.82rem; color: #ff7da0;
            background: rgba(255,125,160,0.08);
            border: 1px solid rgba(255,125,160,0.22);
            padding: 8px 12px;
            border-radius: 10px;
            display: none;
        }
        .nx-modal-error.show { display: block; }
    </style>
</head>
<body class="dark-mode" data-page="nexus">

<div class="nx-layout">
    <!-- Sidebar lives in sidebar-common.js when desktop; on mobile the back button suffices. -->
    <main class="nx-main">

        <header class="nx-topbar">
            <button class="nx-topbar-back" onclick="window.location.href='dashboard.html'">
                <ion-icon name="arrow-back-outline"></ion-icon> Back
            </button>
            <span class="nx-topbar-title">
                <img src="blaksyd-logo-white.png" alt=""> Nexus
            </span>
            <div style="width:60px;"></div>
        </header>

        <!-- Communities strip -->
        <nav id="nx-comm-strip" class="nx-comm-strip" aria-label="Communities">
            <span class="nx-comm-chip" style="opacity:0.5;cursor:default;">Loading communities…</span>
        </nav>

        <section class="nx-feed">
            <div class="nx-feed-inner" id="nx-feed-inner">
                <div class="nx-empty">
                    <ion-icon name="people-outline"></ion-icon>
                    <div class="nx-empty-title">Pick a community above</div>
                    <div>Anonymous handles. Resonance over reach. No upvotes — only "I felt that".</div>
                </div>
            </div>
        </section>

        <!-- Composer (only when a community is active and the user is authed) -->
        <div class="nx-composer" id="nx-composer" style="display:none;">
            <div class="nx-composer-inner">
                <input class="nx-comp-title" id="nx-comp-title" placeholder="Title (optional — set the scene)" maxlength="200">
                <textarea id="nx-comp-body" placeholder="What's on your mind? Anonymous, but Echo and the community will see it." maxlength="8000"></textarea>
                <div class="nx-comp-actions">
                    <span class="nx-comp-hint" id="nx-comp-hint">Posting as <strong id="nx-handle-preview">your handle</strong></span>
                    <button class="nx-comp-send" id="nx-comp-send">
                        <ion-icon name="paper-plane-outline"></ion-icon> Post
                    </button>
                </div>
            </div>
        </div>

    </main>
</div>

<!-- ── Create-community modal (hidden by default) ──────────────────── -->
<div class="nx-modal" id="nx-create-modal" style="display:none;" aria-modal="true" role="dialog" aria-labelledby="nx-create-title">
    <div class="nx-modal-card">
        <div class="nx-modal-hero">
            <button class="nx-modal-close" id="nx-create-close" aria-label="Close">
                <ion-icon name="close-outline"></ion-icon>
            </button>
            <h2 id="nx-create-title">Start a community</h2>
            <p>Create a public space anyone on Blaksyd can join. Anonymous handles, resonance over reach.</p>
        </div>
        <div class="nx-modal-body">
            <label for="nx-create-name">Name</label>
            <input id="nx-create-name" type="text" maxlength="120" placeholder="e.g. Late-night thoughts" autocomplete="off">

            <label for="nx-create-desc">Description (optional)</label>
            <textarea id="nx-create-desc" maxlength="500" placeholder="What is this space for? Who should feel at home here?"></textarea>

            <p class="nx-modal-slug-hint" id="nx-create-slug-hint">Link will be: <strong>/late-night-thoughts</strong></p>

            <div class="nx-modal-error" id="nx-create-error"></div>
        </div>
        <div class="nx-modal-foot">
            <button class="nx-modal-cancel" id="nx-create-cancel">Cancel</button>
            <button class="nx-modal-create" id="nx-create-submit">
                <ion-icon name="add-circle-outline" style="vertical-align:-2px;"></ion-icon>
                Create
            </button>
        </div>
    </div>
</div>

<script src="blakcide-ui-v3.js"></script>

<script>
/* ═════════════════════════════════════════════════════════════════════
   Nexus — community feed (Reddit/X/Threads-style, but Resonance-first)
   Talks to: /api/blaksyd/symp/nexus/{communities,feed,posts,comments,impacts}
   No upvotes. Four positive impact types only:
       felt_seen · resonated · helpful · sending_strength
   ═════════════════════════════════════════════════════════════════════ */
(function () {
    'use strict';

    // ── Supabase auth ───────────────────────────────────────────────────
    const SUPABASE_URL = 'https://uoosspumdmffccinszuj.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVvb3NzcHVtZG1mZmNjaW5zenVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxNzYyNTUsImV4cCI6MjA4Mjc1MjI1NX0.3NayM6uC5-yZv9im-8W7ko28rZFRTnDQbIagN6BArs0';
    const sb = window._sbClient || (window._sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY));

    // ── Constants ───────────────────────────────────────────────────────
    const IMPACT_DEFS = [
        { type: 'felt_seen',         emoji: '👁️',  label: 'Felt seen' },
        { type: 'resonated',         emoji: '🌊', label: 'Resonated' },
        { type: 'helpful',           emoji: '🌱', label: 'Helpful' },
        { type: 'sending_strength',  emoji: '🤍', label: 'Strength' },
    ];

    // Local optimistic store of given impacts: { 'post:abc:felt_seen': true }
    const givenImpacts = new Set();
    function impactKey(target, type) { return `${target.kind}:${target.id}:${type}`; }

    // ── State ───────────────────────────────────────────────────────────
    let communities = [];
    let activeCommunityId = null;
    let posts = [];
    let userId = null;
    let token = null;
    const expandedPostIds = new Set();
    const commentsByPost = {};   // postId → comment[]

    // ── Helpers ─────────────────────────────────────────────────────────
    async function getToken() {
        const { data } = await sb.auth.getSession();
        token  = data?.session?.access_token || null;
        userId = data?.session?.user?.id     || null;
        return token;
    }

    async function api(path, { method = 'GET', body } = {}) {
        await getToken();
        if (!token) throw new Error('Not signed in');
        const res = await fetch('/api/blaksyd/symp/' + path, {
            method,
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`,
            },
            body: body ? JSON.stringify(body) : undefined,
        });
        if (!res.ok) {
            const j = await res.json().catch(() => ({}));
            throw new Error(j?.error?.message || `${method} ${path} failed (${res.status})`);
        }
        return res.json();
    }

    function fmtTime(iso) {
        if (!iso) return '';
        const d = new Date(iso); const now = Date.now();
        const diff = (now - d.getTime()) / 1000;
        if (diff < 60) return 'just now';
        if (diff < 3600) return Math.floor(diff/60) + 'm';
        if (diff < 86400) return Math.floor(diff/3600) + 'h';
        if (diff < 604800) return Math.floor(diff/86400) + 'd';
        return d.toLocaleDateString();
    }

    function handleAvatarStyle(seed) {
        // Stable hue from the seed string
        let h = 0;
        for (let i = 0; i < (seed || '').length; i++) h = (h * 31 + seed.charCodeAt(i)) | 0;
        const hue = Math.abs(h) % 360;
        return `background: hsl(${hue}, 70%, 65%);`;
    }

    function handleInitials(name) {
        if (!name) return '··';
        const m = name.match(/[A-Za-z0-9]/g) || [];
        return (m[0] || '·').toUpperCase() + (m[1] || '·').toUpperCase();
    }

    // ── Render: communities strip ───────────────────────────────────────
    function renderCommStrip() {
        const strip = document.getElementById('nx-comm-strip');
        const newChip = `<button class="nx-comm-new" id="nx-comm-new-btn" type="button" title="Start a new community">
            <ion-icon name="add-outline"></ion-icon> New
        </button>`;
        if (!communities.length) {
            strip.innerHTML = newChip + `<span class="nx-comm-chip" style="opacity:0.55;cursor:default;">No communities yet — start one →</span>`;
        } else {
            strip.innerHTML = newChip + communities.map(c => {
                const ephTag = c.is_ephemeral ? `<span class="nx-eph">live</span>` : '';
                const active = c.id === activeCommunityId ? ' active' : '';
                return `<button class="nx-comm-chip${active}" data-id="${c.id}" data-slug="${c.slug}">
                    ${escapeHtml(c.name)} ${ephTag}
                </button>`;
            }).join('');
        }
        strip.querySelectorAll('.nx-comm-chip[data-id]').forEach(btn => {
            btn.addEventListener('click', () => selectCommunity(btn.dataset.id));
        });
        const newBtn = document.getElementById('nx-comm-new-btn');
        if (newBtn) newBtn.addEventListener('click', openCreateModal);
    }

    // ── Create-community modal ──────────────────────────────────────────
    function slugifyClient(s) {
        return String(s || '')
            .toLowerCase()
            .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '')
            .slice(0, 60);
    }
    function openCreateModal() {
        const m = document.getElementById('nx-create-modal');
        if (!m) return;
        m.style.display = 'flex';
        document.getElementById('nx-create-name').value = '';
        document.getElementById('nx-create-desc').value = '';
        document.getElementById('nx-create-error').classList.remove('show');
        document.getElementById('nx-create-error').textContent = '';
        document.getElementById('nx-create-slug-hint').innerHTML = 'Link will be: <strong>/your-community</strong>';
        setTimeout(() => document.getElementById('nx-create-name').focus(), 60);
    }
    function closeCreateModal() {
        const m = document.getElementById('nx-create-modal');
        if (m) m.style.display = 'none';
    }
    async function submitCreateCommunity() {
        const nameEl = document.getElementById('nx-create-name');
        const descEl = document.getElementById('nx-create-desc');
        const errEl  = document.getElementById('nx-create-error');
        const btn    = document.getElementById('nx-create-submit');
        const name = (nameEl.value || '').trim();
        const desc = (descEl.value || '').trim();
        if (!name) {
            errEl.textContent = 'Give your community a name.';
            errEl.classList.add('show');
            nameEl.focus();
            return;
        }
        btn.disabled = true;
        errEl.classList.remove('show');
        try {
            const r = await api('nexus/communities', {
                method: 'POST',
                body: { name, description: desc || null, slug: slugifyClient(name) },
            });
            const created = r?.data?.community;
            if (!created || !created.id) throw new Error('Could not create — try a different name.');
            // Prepend so it shows up first.
            communities = [created, ...communities.filter(c => c.id !== created.id)];
            closeCreateModal();
            renderCommStrip();
            await selectCommunity(created.id);
            if (window.blakcideToast) window.blakcideToast('Community created — invite people to join 🌱', { tone: 'mint' });
        } catch (e) {
            errEl.textContent = (e && e.message) ? e.message : 'Something went wrong. Try again.';
            errEl.classList.add('show');
        } finally {
            btn.disabled = false;
        }
    }

    // ── Render: feed ────────────────────────────────────────────────────
    function escapeHtml(s) {
        return String(s == null ? '' : s)
            .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function renderHero() {
        const c = communities.find(x => x.id === activeCommunityId);
        if (!c) return '';
        const eph = c.is_ephemeral
            ? `<span><ion-icon name="flash-outline"></ion-icon> Pop-up community</span>`
            : `<span><ion-icon name="infinite-outline"></ion-icon> Always open</span>`;
        return `<div class="nx-comm-hero">
            <h1>${escapeHtml(c.name)}</h1>
            ${c.description ? `<p>${escapeHtml(c.description)}</p>` : ''}
            <div class="nx-comm-meta">
                ${eph}
                <span><ion-icon name="lock-closed-outline"></ion-icon> Anonymous handles</span>
                <span><ion-icon name="heart-outline"></ion-icon> Resonance over reach</span>
            </div>
        </div>`;
    }

    function renderPost(p) {
        const handle = p.author?.handle || (p.is_ai_author ? 'Echo' : 'Anonymous');
        const seed   = p.author?.avatar_seed || handle;
        const initials = handleInitials(handle);
        const aiBadge  = p.is_ai_author ? `<span class="nx-ai-badge">AI · Echo</span>` : '';
        const reso     = p.resonance && !p.resonance.self
            ? `<span class="nx-resonance" title="How closely your inner-world rhymes with theirs">${p.resonance.percent}% resonance</span>`
            : '';
        const softHidden = p.is_soft_hidden ? ' soft-hidden' : '';
        const isAi       = p.is_ai_author ? ' is-ai' : '';

        const impactBtns = IMPACT_DEFS.map(def => {
            const given = givenImpacts.has(impactKey({kind:'post',id:p.id}, def.type));
            return `<button class="nx-impact-btn${given ? ' given' : ''}"
                            data-pid="${p.id}" data-impact="${def.type}"
                            title="${def.label}">
                <span class="nx-impact-emoji">${def.emoji}</span>
                ${def.label}
            </button>`;
        }).join('');

        const open = expandedPostIds.has(p.id) ? ' open' : '';
        const commentsHtml = renderComments(p.id);

        return `<article class="nx-post${isAi}${softHidden}" data-pid="${p.id}">
            ${p.is_soft_hidden ? `<div style="font-size:0.74rem;color:#ff7da0;margin-bottom:6px;font-weight:700;">⚠ Soft-hidden — Echo reached out to the author privately.</div>` : ''}
            <header class="nx-post-head">
                <div class="nx-handle-avatar" style="${handleAvatarStyle(seed)}">${initials}</div>
                <div class="nx-handle-name">
                    ${escapeHtml(handle)} ${aiBadge}
                </div>
                ${reso}
                <span class="nx-post-time">${fmtTime(p.created_at)}</span>
            </header>
            ${p.title ? `<div class="nx-post-title">${escapeHtml(p.title)}</div>` : ''}
            <div class="nx-post-body">${escapeHtml(p.body)}</div>
            <div class="nx-impact-row">
                ${impactBtns}
                <button class="nx-comments-toggle" data-pid="${p.id}">
                    <ion-icon name="chatbubble-ellipses-outline"></ion-icon>
                    ${p.comment_count || 0}
                </button>
            </div>
            <div class="nx-comments${open}" id="nx-comments-${p.id}">${commentsHtml}</div>
        </article>`;
    }

    function renderComments(postId) {
        const items = commentsByPost[postId] || [];
        const itemsHtml = items.length
            ? items.map(c => {
                const handle = c.author?.handle || (c.is_ai_author ? 'Echo' : 'Anonymous');
                const seed   = c.author?.avatar_seed || handle;
                const aiBadge = c.is_ai_author ? `<span class="nx-ai-badge">AI</span>` : '';
                return `<div class="nx-comment${c.is_ai_author ? ' is-ai' : ''}">
                    <div class="nx-comment-head">
                        <div class="nx-handle-avatar" style="width:22px;height:22px;font-size:0.6rem;${handleAvatarStyle(seed)}">${handleInitials(handle)}</div>
                        ${escapeHtml(handle)} ${aiBadge}
                        <span class="nx-comment-time">${fmtTime(c.created_at)}</span>
                    </div>
                    <div class="nx-comment-body">${escapeHtml(c.body)}</div>
                </div>`;
            }).join('')
            : `<div style="font-size:0.82rem;color:var(--text-3);text-align:center;padding:10px;">No replies yet — be the first.</div>`;

        return `${itemsHtml}
            <div class="nx-comment-composer">
                <input type="text" placeholder="Reply gently…" data-pid="${postId}" maxlength="2000">
                <button data-pid="${postId}">Send</button>
            </div>`;
    }

    function renderFeed() {
        const inner = document.getElementById('nx-feed-inner');
        if (!activeCommunityId) {
            inner.innerHTML = `<div class="nx-empty">
                <ion-icon name="people-outline"></ion-icon>
                <div class="nx-empty-title">Pick a community above</div>
                <div>Anonymous handles. Resonance over reach. No upvotes — only "I felt that".</div>
            </div>`;
            return;
        }
        if (!posts.length) {
            inner.innerHTML = renderHero() + `<div class="nx-empty" style="padding:40px 20px;">
                <ion-icon name="leaf-outline"></ion-icon>
                <div class="nx-empty-title">Be the first voice here</div>
                <div>Share what's on your mind. Echo will likely meet you in the comments.</div>
            </div>`;
            return;
        }
        inner.innerHTML = renderHero() + posts.map(renderPost).join('');
        // Wire up
        inner.querySelectorAll('.nx-impact-btn').forEach(b => {
            b.addEventListener('click', () => giveImpact(b.dataset.pid, b.dataset.impact, b));
        });
        inner.querySelectorAll('.nx-comments-toggle').forEach(b => {
            b.addEventListener('click', () => toggleComments(b.dataset.pid));
        });
        inner.querySelectorAll('.nx-comment-composer button').forEach(b => {
            b.addEventListener('click', () => sendComment(b.dataset.pid));
        });
        inner.querySelectorAll('.nx-comment-composer input').forEach(inp => {
            inp.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault(); sendComment(inp.dataset.pid);
                }
            });
        });
    }

    // ── Actions ─────────────────────────────────────────────────────────
    async function loadCommunities() {
        try {
            const r = await api('nexus/communities');
            communities = (r?.data?.communities || []).filter(c => !c.is_archived);
            renderCommStrip();
            // Auto-pick first community
            if (communities.length && !activeCommunityId) {
                selectCommunity(communities[0].id);
            }
        } catch (e) {
            console.warn('[nexus] communities load failed:', e.message);
            renderCommStrip();
            // Show auth-needed banner if 401
            if (/sign in|401/i.test(e.message)) {
                document.getElementById('nx-feed-inner').innerHTML = `
                <div class="nx-need-auth">
                    <strong style="font-size:1.05rem;">You need to sign in to enter Nexus.</strong>
                    <p style="color:var(--text-2);font-size:0.88rem;margin:8px 0 0;">Communities are private spaces for verified members.</p>
                    <a href="../login.html">Sign in</a>
                </div>`;
            }
        }
    }

    async function selectCommunity(id) {
        activeCommunityId = id;
        posts = []; expandedPostIds.clear();
        renderCommStrip();
        document.getElementById('nx-feed-inner').innerHTML = `<div class="nx-empty"><ion-icon name="hourglass-outline"></ion-icon> Loading…</div>`;
        document.getElementById('nx-composer').style.display = 'block';
        try {
            // Best-effort join (idempotent on the backend)
            await api('nexus/communities/join', { method: 'POST', body: { community_id: id } }).catch(() => {});
            const r = await api('nexus/feed?community_id=' + encodeURIComponent(id));
            posts = r?.data?.posts || [];
            renderFeed();
        } catch (e) {
            document.getElementById('nx-feed-inner').innerHTML = `<div class="nx-empty">
                <ion-icon name="cloud-offline-outline"></ion-icon>
                <div class="nx-empty-title">Couldn't load this community</div>
                <div>${escapeHtml(e.message)}</div>
            </div>`;
        }
    }

    async function giveImpact(postId, impactType, btn) {
        const key = impactKey({kind:'post',id:postId}, impactType);
        const already = givenImpacts.has(key);
        // Optimistic flip
        if (already) givenImpacts.delete(key); else givenImpacts.add(key);
        if (btn) btn.classList.toggle('given', !already);
        if (window.blakcideHaptic) window.blakcideHaptic(8);
        try {
            await api('nexus/impacts', {
                method: already ? 'DELETE' : 'POST',
                body: { post_id: postId, impact_type: impactType },
            });
        } catch (e) {
            // Revert on failure
            if (already) givenImpacts.add(key); else givenImpacts.delete(key);
            if (btn) btn.classList.toggle('given', already);
            if (window.blakcideToast) window.blakcideToast('Impact didn\'t save — try again', { tone: 'coral' });
        }
    }

    async function toggleComments(postId) {
        const open = expandedPostIds.has(postId);
        const wrap = document.getElementById('nx-comments-' + postId);
        if (open) {
            expandedPostIds.delete(postId);
            wrap && wrap.classList.remove('open');
            return;
        }
        expandedPostIds.add(postId);
        wrap && wrap.classList.add('open');
        // Load if not loaded yet
        if (!commentsByPost[postId]) {
            try {
                const r = await api('nexus/posts?id=' + encodeURIComponent(postId));
                commentsByPost[postId] = r?.data?.comments || [];
                renderFeed();   // re-render so the post-level comment_count etc. stays in sync
                expandedPostIds.add(postId);
                document.getElementById('nx-comments-' + postId)?.classList.add('open');
            } catch (e) {
                console.warn('[nexus] comments load failed:', e.message);
            }
        }
    }

    async function sendComment(postId) {
        const wrap = document.getElementById('nx-comments-' + postId);
        const input = wrap?.querySelector('.nx-comment-composer input');
        const btn   = wrap?.querySelector('.nx-comment-composer button');
        const body  = (input?.value || '').trim();
        if (!body) return;
        if (btn) btn.disabled = true;
        try {
            const r = await api('nexus/comments', {
                method: 'POST',
                body: { post_id: postId, body },
            });
            const c = r?.data?.comment;
            if (c) {
                commentsByPost[postId] = [...(commentsByPost[postId] || []), c];
                // bump comment_count on the cached post
                const p = posts.find(x => x.id === postId);
                if (p) p.comment_count = (p.comment_count || 0) + 1;
            }
            if (input) input.value = '';
            renderFeed();
            // keep open
            expandedPostIds.add(postId);
            document.getElementById('nx-comments-' + postId)?.classList.add('open');
            if (window.blakcideHaptic) window.blakcideHaptic(8);
        } catch (e) {
            if (window.blakcideToast) window.blakcideToast(e.message, { tone: 'coral' });
        } finally {
            if (btn) btn.disabled = false;
        }
    }

    async function publishPost() {
        const titleEl = document.getElementById('nx-comp-title');
        const bodyEl  = document.getElementById('nx-comp-body');
        const sendBtn = document.getElementById('nx-comp-send');
        const title = titleEl.value.trim();
        const body  = bodyEl.value.trim();
        if (!body) {
            bodyEl.focus();
            if (window.blakcideToast) window.blakcideToast('Add a few words first', { tone: 'amber' });
            return;
        }
        if (!activeCommunityId) return;
        sendBtn.disabled = true;
        try {
            const r = await api('nexus/posts', {
                method: 'POST',
                body: { community_id: activeCommunityId, title: title || null, body },
            });
            const post = r?.data?.post;
            if (post) {
                posts = [post, ...posts];
                renderFeed();
                titleEl.value = ''; bodyEl.value = '';
                if (window.blakcideToast) window.blakcideToast('✓ Posted anonymously');
                if (window.blakcideHaptic) window.blakcideHaptic(12);
                // scroll to top of feed so the new post is visible
                document.querySelector('.nx-feed')?.scrollTo({ top: 0, behavior: 'smooth' });
            }
        } catch (e) {
            if (window.blakcideToast) window.blakcideToast(e.message, { tone: 'coral' });
        } finally {
            sendBtn.disabled = false;
        }
    }

    // ── Init ────────────────────────────────────────────────────────────
    async function init() {
        // Wait for auth to settle
        await getToken();
        if (!token) {
            // Not signed in — surface a friendly nudge.
            document.getElementById('nx-feed-inner').innerHTML = `
            <div class="nx-need-auth">
                <strong style="font-size:1.05rem;">Sign in to enter Nexus.</strong>
                <p style="color:var(--text-2);font-size:0.88rem;margin:8px 0 0;">Anonymous communities for the things only strangers understand.</p>
                <a href="../index.html">Go to sign-in</a>
            </div>`;
            return;
        }

        document.getElementById('nx-comp-send').addEventListener('click', publishPost);
        document.getElementById('nx-comp-body').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); publishPost(); }
        });

        // Create-community modal wiring
        document.getElementById('nx-create-close').addEventListener('click', closeCreateModal);
        document.getElementById('nx-create-cancel').addEventListener('click', closeCreateModal);
        document.getElementById('nx-create-submit').addEventListener('click', submitCreateCommunity);
        document.getElementById('nx-create-modal').addEventListener('click', (e) => {
            if (e.target.id === 'nx-create-modal') closeCreateModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById('nx-create-modal').style.display === 'flex') {
                closeCreateModal();
            }
        });
        const nameEl = document.getElementById('nx-create-name');
        const slugHint = document.getElementById('nx-create-slug-hint');
        nameEl.addEventListener('input', () => {
            const s = slugifyClient(nameEl.value) || 'your-community';
            slugHint.innerHTML = `Link will be: <strong>/${s}</strong>`;
        });
        nameEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submitCreateCommunity(); }
        });

        loadCommunities();
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
})();
</script>

</body>
</html>
