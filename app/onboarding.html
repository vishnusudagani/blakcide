<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Blaksyd</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        body {
            background-color: var(--bg-color); color: var(--text-color);
            font-family: 'Inter', sans-serif; display: flex; justify-content: center;
            align-items: center; height: 100vh; margin: 0;
        }
        .glass-pane {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px); padding: 40px; border-radius: 20px;
            width: 90%; max-width: 400px; text-align: center;
        }
        .minimal-input, select {
            width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 10px;
            border: 1px solid var(--glass-border); background: rgba(0,0,0,0.2);
            color: white; font-size: 1rem; box-sizing: border-box;
        }
        .btn-solid {
            width: 100%; padding: 12px; background: white; color: black;
            border: none; border-radius: 10px; font-weight: bold; cursor: pointer;
            font-size: 1rem; transition: 0.2s;
        }
        .btn-solid:hover { background: #e0e0e0; }
    </style>
</head>
<body>

    <div class="glass-pane">
        <h2>Welcome to Blaksyd</h2>
        <p style="opacity: 0.7; margin-bottom: 30px; font-size: 0.9rem;">A few details so Blak knows who it's talking to.</p>
        
        <input type="text" id="ob-name" class="minimal-input" placeholder="What should we call you? (Full Name)">

        <div style="position:relative;">
            <input type="text" id="ob-username" class="minimal-input" placeholder="Pick a username (3–20, a–z, 0–9, _)" autocomplete="off" autocapitalize="off" spellcheck="false" style="margin-bottom:6px; padding-right: 38px;">
            <span id="ob-username-status" style="position:absolute; right:12px; top:14px; font-size:0.95rem;"></span>
        </div>
        <div id="ob-username-hint" style="text-align:left; opacity:0.6; font-size:0.75rem; margin: -2px 0 16px 5px;">This is your public handle — choose one you'll be happy with.</div>

        <div style="text-align: left; opacity: 0.7; font-size: 0.8rem; margin-bottom: 5px; margin-left: 5px;">Date of Birth <span style="opacity:0.7;">(optional)</span></div>
        <input type="date" id="ob-dob" class="minimal-input">

        <div style="text-align: left; opacity: 0.7; font-size: 0.8rem; margin-bottom: 5px; margin-left: 5px;">Gender <span style="opacity:0.7;">(optional)</span></div>
        <select id="ob-gender" class="minimal-input">
            <option value="" disabled selected>Select Gender (optional)</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Non-Binary">Non-Binary</option>
            <option value="Prefer not to say">Prefer not to say</option>
        </select>

        <div style="text-align: left; opacity: 0.7; font-size: 0.8rem; margin-bottom: 5px; margin-left: 5px;">What should Blak know about you? <span style="opacity:0.7;">(optional)</span></div>
        <textarea id="ob-about" class="minimal-input" rows="3" placeholder="Anything you want — what you're into, what's going on, how you like to be talked to." style="resize: vertical; font-family: inherit;"></textarea>

        <label style="display:flex; align-items:flex-start; gap:8px; text-align:left; font-size:0.8rem; opacity:0.85; margin-bottom:12px; cursor:pointer;">
            <input type="checkbox" id="ob-age" style="margin-top:2px; flex-shrink:0;">
            <span>I'm 18 or older.</span>
        </label>
        <label style="display:flex; align-items:flex-start; gap:8px; text-align:left; font-size:0.8rem; opacity:0.85; margin-bottom:20px; cursor:pointer;">
            <input type="checkbox" id="ob-consent" style="margin-top:2px; flex-shrink:0;">
            <span>I agree to the <a href="/terms" target="_blank" rel="noopener" style="color:inherit; text-decoration:underline;">Terms</a> and <a href="/privacy" target="_blank" rel="noopener" style="color:inherit; text-decoration:underline;">Privacy Policy</a>.</span>
        </label>

        <div id="ob-error" style="display:none; margin: 0 0 14px; padding: 10px 12px; border-radius: 8px; background: rgba(255,76,76,0.12); border: 1px solid rgba(255,76,76,0.4); color:#ffb3b3; font-size:0.85rem; text-align:left;"></div>
        <button id="save-btn" class="btn-solid" disabled style="opacity:0.5; cursor:not-allowed;">Enter Blaksyd <ion-icon name="arrow-forward"></ion-icon></button>
    </div>

    <script>
        const SUPABASE_URL = 'https://uoosspumdmffccinszuj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVvb3NzcHVtZG1mZmNjaW5zenVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxNzYyNTUsImV4cCI6MjA4Mjc1MjI1NX0.3NayM6uC5-yZv9im-8W7ko28rZFRTnDQbIagN6BArs0';

        if (typeof window.supabase === 'undefined') {
            document.getElementById('ob-error').style.display = 'block';
            document.getElementById('ob-error').innerText = 'Auth library failed to load. Check your network and reload.';
        }
        const sb = window._sbClient || (window._sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY));

        const errBox = document.getElementById('ob-error');
        const showErr = (msg) => { errBox.style.display = 'block'; errBox.innerText = msg; };
        const clearErr = () => { errBox.style.display = 'none'; errBox.innerText = ''; };

        // Compute age in whole years from a yyyy-mm-dd date string.
        function computeAge(dobStr) {
            const d = new Date(dobStr);
            if (isNaN(d.getTime())) return NaN;
            const now = new Date();
            let age = now.getFullYear() - d.getFullYear();
            const m = now.getMonth() - d.getMonth();
            if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
            return age;
        }

        // ── Username live validation + availability ───────────────────────
        const USERNAME_RE = /^[a-z0-9_]{3,20}$/;
        const usernameInput = document.getElementById('ob-username');
        const usernameStatus = document.getElementById('ob-username-status');
        let usernameDebounce = null;
        let usernameOk = false;

        function setStatus(symbol, color) {
            usernameStatus.textContent = symbol;
            usernameStatus.style.color = color;
        }

        async function checkUsername() {
            const raw = usernameInput.value.trim().toLowerCase();
            usernameInput.value = raw; // normalise in place
            usernameOk = false;
            if (!raw) { setStatus('', ''); return; }
            if (!USERNAME_RE.test(raw)) { setStatus('✕', '#ff6b6b'); return; }
            setStatus('…', '#aaa');
            const { data, error } = await sb.from('profiles').select('id').eq('username', raw).maybeSingle();
            if (error && error.code !== 'PGRST116') {
                console.warn('[onboarding] username check failed', error);
                setStatus('?', '#ffb733');
                return;
            }
            if (data) { setStatus('✕', '#ff6b6b'); usernameOk = false; }
            else      { setStatus('✓', '#5cdc8a'); usernameOk = true; }
        }

        usernameInput.addEventListener('input', () => {
            clearTimeout(usernameDebounce);
            usernameDebounce = setTimeout(checkUsername, 300);
        });

        async function saveProfile() {
            clearErr();
            const name = document.getElementById('ob-name').value.trim();
            const username = usernameInput.value.trim().toLowerCase();
            const dob = document.getElementById('ob-dob').value;
            const gender = document.getElementById('ob-gender').value;
            const about = document.getElementById('ob-about').value.trim();

            if (!name) { showErr('Please tell us your name so we know what to call you.'); return; }
            if (!username) { showErr('Pick a username — this is how others will see you.'); return; }
            if (!USERNAME_RE.test(username)) { showErr('Username must be 3–20 chars: lowercase letters, digits, or underscore.'); return; }

            // DOB is optional, but if provided and it computes to under 18, block.
            if (dob && computeAge(dob) < 18) {
                showErr('You need to be 18 or older to use Blaksyd right now.');
                return;
            }
            if (!usernameOk) {
                // Re-check synchronously in case the user submitted before the debounce fired.
                await checkUsername();
                if (!usernameOk) { showErr('That username is taken or invalid — try another.'); return; }
            }

            const btn = document.getElementById('save-btn');
            const prevHTML = btn.innerHTML;
            btn.innerText = 'Saving…'; btn.disabled = true;

            try {
                let { data: { session } } = await sb.auth.getSession();
                if (!session) {
                    const refreshed = await sb.auth.refreshSession();
                    session = refreshed?.data?.session || null;
                }
                if (!session) {
                    showErr('Session expired. Returning to sign-in…');
                    setTimeout(() => { window.location.href = '../index.html'; }, 1200);
                    return;
                }

                // Keep a local fallback copy of the "about" text regardless of
                // whether the DB column exists.
                try { localStorage.setItem('blak-about', about || ''); } catch (_) {}

                const baseProfile = {
                    id:        session.user.id,
                    full_name: name,
                    username:  username,
                    dob:       dob || null,
                    gender:    gender || null,
                };

                let { error } = await sb.from('profiles').upsert({
                    ...baseProfile,
                    about: about || null,
                });

                // If the 'about' column doesn't exist yet, retry without it so
                // onboarding still succeeds (the localStorage copy is kept).
                if (error && /column/i.test(error.message || '') && /about/i.test(error.message || '')) {
                    console.warn('[onboarding] "about" column missing — retrying upsert without it', error);
                    ({ error } = await sb.from('profiles').upsert(baseProfile));
                }

                if (error) {
                    console.error('[onboarding] profile upsert failed', error);
                    if (error.code === '23505' || /duplicate key|already exists/i.test(error.message || '')) {
                        showErr('That username was just taken. Try a different one.');
                        usernameOk = false;
                        setStatus('✕', '#ff6b6b');
                    } else {
                        showErr('Could not save profile: ' + (error.message || 'unknown error'));
                    }
                    btn.innerHTML = prevHTML; btn.disabled = false;
                    return;
                }

                window.location.href = 'dashboard.html';
            } catch (e) {
                console.error('[onboarding] unexpected error', e);
                showErr('Something went wrong: ' + (e?.message || e));
                btn.innerHTML = prevHTML; btn.disabled = false;
            }
        }

        document.getElementById('save-btn').addEventListener('click', saveProfile);
        ['ob-name','ob-dob','ob-gender'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveProfile(); });
        });

        // ── Consent + age gating: enable the button only when both are ticked ──
        const ageCheck = document.getElementById('ob-age');
        const consentCheck = document.getElementById('ob-consent');
        const saveBtn = document.getElementById('save-btn');
        function refreshSaveState() {
            const ready = ageCheck.checked && consentCheck.checked;
            saveBtn.disabled = !ready;
            saveBtn.style.opacity = ready ? '1' : '0.5';
            saveBtn.style.cursor = ready ? 'pointer' : 'not-allowed';
        }
        ageCheck.addEventListener('input', refreshSaveState);
        consentCheck.addEventListener('input', refreshSaveState);
        refreshSaveState();
    </script>
</body>
</html>
