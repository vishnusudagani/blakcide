<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Living Journal – Blakcide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app-style.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="ai-service.js"></script>
    <style>
        html, body {
            height: 100dvh;
            overflow: hidden;
            background: var(--bg);
        }

        /* Full app shell — sidebar + main */
        .app-layout {
            display: flex;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
        }

        /* ── Journal editor main area ── */
        .journal-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            min-width: 0;
        }

        /* Mobile header */
        .journal-mobile-header {
            display: none;
            height: var(--header-h);
            padding: 0 16px;
            background: var(--surface-1);
            border-bottom: 1px solid var(--border);
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 50;
        }
        @media (max-width: 768px) {
            .journal-mobile-header { display: flex; }
        }

        /* Editor pane */
        .journal-editor {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 24px;
        }
        @media (max-width: 768px) {
            .journal-editor { padding: 16px; }
        }

        /* Title input */
        #entry-title {
            width: 100%;
            background: none;
            border: none;
            border-bottom: 1px solid var(--border);
            outline: none;
            color: var(--text);
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            font-family: 'Playfair Display', serif;
            font-weight: 500;
            padding: 0 0 14px;
            margin-bottom: 0;
            letter-spacing: -0.01em;
            transition: border-color 0.2s;
        }
        #entry-title:focus { border-bottom-color: var(--accent-mid); }
        #entry-title::placeholder { color: var(--text-3); }

        /* Meta bar */
        .journal-meta-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 14px 0 0;
            align-items: center;
            flex-shrink: 0;
        }
        .meta-chip {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text-2);
            cursor: pointer;
            outline: none;
            font-family: inherit;
            transition: background 0.2s;
            -webkit-appearance: none;
            appearance: none;
        }
        .meta-chip:focus, .meta-chip:hover { background: var(--surface-3); color: var(--text); border-color: var(--border-md); }

        /* Content area */
        #entry-content {
            flex: 1;
            width: 100%;
            background: none;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 15px;
            line-height: 1.9;
            resize: none;
            padding: 18px 0;
            font-family: inherit;
            min-height: 0;
            -webkit-overflow-scrolling: touch;
            overflow-y: auto;
        }
        #entry-content::placeholder { color: var(--text-3); }

        /* Media previews */
        #media-preview-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
        }

        /* Toolbar */
        .journal-toolbar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 10px 0;
            border-top: 1px solid var(--border);
            padding-bottom: max(10px, calc(10px + env(safe-area-inset-bottom)));
        }

        .toolbar-btn {
            width: 42px; height: 42px;
            display: flex; align-items: center; justify-content: center;
            background: none; border: none;
            color: var(--text-3); font-size: 1.2rem;
            cursor: pointer; border-radius: 10px;
            transition: color 0.2s, background 0.2s;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .toolbar-btn:hover, .toolbar-btn:active { color: var(--text); background: var(--surface-2); }
        .toolbar-btn.recording { color: var(--red); animation: pulse 1.2s infinite; }

        .toolbar-spacer { flex: 1; }

        .save-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 9px 18px;
            border-radius: 24px;
            background: var(--surface-2);
            border: 1px solid var(--border-md);
            color: var(--text-2);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            cursor: default;
            font-family: inherit;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .save-btn.unsaved {
            background: var(--accent-dim);
            border-color: var(--accent-mid);
            color: var(--accent);
            cursor: pointer;
        }
        .save-btn.unsaved:hover { background: var(--accent-mid); }

        .reflect-btn {
            display: none;
            align-items: center; gap: 6px;
            padding: 9px 16px;
            border-radius: 24px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text-2);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s, color 0.2s;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .reflect-btn:hover { background: var(--surface-3); color: var(--text); }

        /* Sidebar journal list extras */
        .sidebar-entry-date {
            font-size: 0.68rem; color: var(--text-3);
            margin-top: 1px;
        }
        .history-item .entry-title-text {
            flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
    </style>
</head>
<body class="dark-mode" data-page="journal">

<canvas id="pearl-canvas"></canvas>

<div class="app-layout">

    <div id="mobile-overlay" class="mobile-overlay"></div>

    <!-- ── SIDEBAR ── -->
    <nav class="sidebar glass-panel" id="main-sidebar">
        <div class="sidebar-header">
            <button id="nav-dashboard-btn" class="brand-small-btn">BLAKCIDE</button>
            <button id="toggle-sidebar-btn" class="collapse-btn">
                <ion-icon name="chevron-back-outline"></ion-icon>
            </button>
        </div>

        <!-- Tools -->
        <div class="sidebar-section-label">Journal</div>
        <div class="sidebar-tools">
            <button id="new-entry-btn"     class="tool-btn active" title="New Entry">   <ion-icon name="create-outline"></ion-icon></button>
            <button id="calendar-view-btn" class="tool-btn"        title="Calendar">    <ion-icon name="calendar-outline"></ion-icon></button>
            <button id="archive-view-btn"  class="tool-btn"        title="Archives">    <ion-icon name="archive-outline"></ion-icon></button>
            <button id="vault-btn"         class="tool-btn"        title="Vault">       <ion-icon name="lock-closed-outline"></ion-icon></button>
        </div>

        <h3 class="view-title" id="view-title" style="display:none;"></h3>
        <div class="history-list" id="journal-list"></div>

        <!-- Spacer -->
        <div class="sidebar-spacer"></div>
        <div class="sidebar-divider"></div>

        <!-- Cross-page navigation -->
        <div class="sidebar-section-label">Navigate</div>
        <nav class="sidebar-nav-section">
            <a class="snav-item" href="dashboard.html">
                <ion-icon name="home-outline"></ion-icon><span>Home</span>
            </a>
            <a class="snav-item" href="chat.html">
                <ion-icon name="sparkles-outline"></ion-icon><span>AI Chat</span>
            </a>
            <a class="snav-item active" href="journal.html">
                <ion-icon name="book-outline"></ion-icon><span>Journal</span>
            </a>
            <a class="snav-item" href="connect.html">
                <ion-icon name="people-outline"></ion-icon><span>Connect</span>
            </a>
        </nav>

        <div class="sidebar-divider"></div>

        <!-- Theme toggle -->
        <button class="theme-toggle-btn">
            <ion-icon name="sunny-outline"></ion-icon><span>Light mode</span>
        </button>

        <!-- User footer -->
        <div class="user-profile glass-panel-inner" id="open-profile-btn"
             onclick="document.getElementById('global-profile-modal').style.display='flex'">
            <img class="global-avatar avatar-circle" style="width:36px;height:36px;object-fit:cover;display:none;" id="sidebar-avatar">
            <div id="sidebar-avatar-placeholder" class="avatar-circle-placeholder">
                <ion-icon name="person"></ion-icon>
            </div>
            <div class="user-info">
                <span class="global-name user-name" id="user-name-display">Loading…</span>
                <span class="user-email" id="user-email-display">…</span>
            </div>
            <button class="logout-link" title="Logout"
                    onclick="event.stopPropagation(); window.universalLogout && window.universalLogout()">
                <ion-icon name="log-out-outline"></ion-icon>
            </button>
        </div>
    </nav>

    <!-- ── JOURNAL EDITOR ── -->
    <main class="journal-main">

        <!-- Mobile header -->
        <div class="journal-mobile-header">
            <button id="mobile-menu-btn" class="mobile-menu-btn">
                <ion-icon name="menu-outline"></ion-icon>
            </button>
            <span id="mobile-journal-title" style="font-weight:600;font-size:0.92rem;flex:1;text-align:center;padding:0 8px;">
                Living Journal
            </span>
            <button id="delete-entry-btn" class="mobile-menu-btn" style="color:var(--red);display:none;">
                <ion-icon name="trash-outline"></ion-icon>
            </button>
        </div>

        <!-- Editor -->
        <div class="journal-editor">
            <input type="text" id="entry-title" placeholder="Give this moment a title…" autocomplete="off">

            <div class="journal-meta-bar">
                <select id="emotion-select" class="meta-chip">
                    <option value="">☁️ State of Mind</option>
                    <option value="Joyful">☀️ Joyful</option>
                    <option value="Peaceful">🍃 Peaceful</option>
                    <option value="Neutral">🌫️ Neutral</option>
                    <option value="Anxious">🌧️ Anxious</option>
                    <option value="Sad">💧 Sad</option>
                    <option value="Frustrated">⛈️ Frustrated</option>
                </select>

                <div class="loc-wrapper">
                    <ion-icon name="location-outline" class="loc-pin-icon"></ion-icon>
                    <input type="text" id="location-input" class="meta-chip"
                        placeholder="Location…" autocomplete="off"
                        style="padding:6px 24px 6px 26px;width:130px;transition:width 0.3s;">
                    <button id="loc-clear-btn" class="loc-clear-btn" type="button">&times;</button>
                    <div id="location-suggestions" class="loc-suggestions"></div>
                </div>
            </div>

            <textarea id="entry-content" placeholder="What's on your mind today?"></textarea>

            <div id="media-preview-container"></div>

            <!-- Toolbar -->
            <div class="journal-toolbar">
                <input type="file" id="upload-image-input" accept="image/*"         style="display:none;">
                <input type="file" id="capture-image-input" accept="image/*" capture style="display:none;">
                <input type="file" id="upload-video-input"  accept="video/*" capture style="display:none;">

                <button id="btn-upload-img"   class="toolbar-btn" title="Upload Photo"> <ion-icon name="image-outline"></ion-icon></button>
                <button id="btn-capture-img"  class="toolbar-btn" title="Camera">       <ion-icon name="camera-outline"></ion-icon></button>
                <button id="btn-video"        class="toolbar-btn" title="Video">        <ion-icon name="videocam-outline"></ion-icon></button>
                <button id="btn-record-audio" class="toolbar-btn" title="Voice Note">   <ion-icon name="mic-outline"></ion-icon></button>

                <button onclick="window.attachSpotify()" class="toolbar-btn" title="Add Music" style="color:#1DB954;">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
                    </svg>
                </button>

                <div class="toolbar-spacer"></div>

                <button id="reflect-ai-btn" class="reflect-btn" title="Chat with AI about this specific journal entry">
                    <ion-icon name="sparkles"></ion-icon> Reflect on entry
                </button>

                <button id="save-entry-btn" class="save-btn">Saved</button>
            </div>
        </div>
    </main>
</div>

<!-- Toast -->
<div id="toast-container" class="toast-container"></div>

<!-- Context menu -->
<div class="glass-context-menu" id="context-menu">
    <button id="cm-archive"><ion-icon name="archive"></ion-icon> Archive</button>
    <button id="cm-vault">  <ion-icon name="lock-closed"></ion-icon> Lock</button>
    <button id="cm-delete" class="danger-text"><ion-icon name="trash"></ion-icon> Delete</button>
</div>

<!-- PIN Modal -->
<div class="overlay-glass" id="pin-modal">
    <div class="glass-pane" style="text-align:center;max-width:340px;">
        <h3 class="serif-header" id="pin-msg" style="font-size:1.4rem;">Enter Vault PIN</h3>
        <input type="password" id="pin-input" class="minimal-input pin-box" maxlength="4">
        <div class="modal-actions">
            <button id="pin-cancel"  class="btn-glass">Cancel</button>
            <button id="pin-confirm" class="btn-solid">Unlock</button>
        </div>
    </div>
</div>

<!-- Location modal (fallback) -->
<div class="overlay-glass" id="location-modal" style="z-index:10000;">
    <div class="glass-pane" style="text-align:center;max-width:340px;">
        <h3 class="serif-header" style="font-size:1.2rem;margin-bottom:12px;">Add Location</h3>
        <input type="text" id="custom-location-input" class="minimal-input" placeholder="E.g., Central Park…">
        <div style="display:flex;flex-direction:column;gap:10px;">
            <button id="save-custom-loc-btn" class="btn-solid">Save</button>
            <div style="font-size:0.75rem;color:var(--text-3);text-align:center;">or</div>
            <button id="use-gps-loc-btn" class="btn-glass"><ion-icon name="locate"></ion-icon> Use GPS</button>
            <button class="btn-glass" style="opacity:0.5;" onclick="document.getElementById('location-modal').classList.remove('active')">Cancel</button>
        </div>
    </div>
</div>

<!-- AI Reflection Modal (reflects on THIS journal entry — separate from AI Companion chat) -->
<div class="overlay-glass" id="entry-chat-modal" style="z-index:10000;">
    <div class="glass-pane profile-pane-wide" style="display:flex;flex-direction:column;padding:0;height:82dvh;background:var(--surface-1);">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface-2);">
            <div>
                <div style="font-weight:700;font-size:0.88rem;display:flex;align-items:center;gap:6px;">
                    <ion-icon name="book-outline" style="color:var(--accent);"></ion-icon> Journal Reflection
                </div>
                <div style="font-size:0.68rem;color:var(--text-3);margin-top:1px;">AI reflecting on this entry · not saved to AI chat</div>
            </div>
            <button class="mobile-menu-btn" onclick="document.getElementById('entry-chat-modal').classList.remove('active')">
                <ion-icon name="close-outline"></ion-icon>
            </button>
        </div>
        <div id="entry-chat-feed" class="chat-feed" style="flex:1;overflow-y:auto;padding:16px;"></div>
        <form id="entry-chat-form" style="display:flex;gap:10px;padding:12px;border-top:1px solid var(--border);flex-shrink:0;">
            <input type="text" id="entry-chat-input" class="minimal-input"
                placeholder="Share more…"
                style="flex:1;border-radius:24px;padding:10px 14px;margin-bottom:0;font-size:16px;background:var(--surface-2);">
            <button type="submit" style="width:42px;height:42px;border-radius:50%;background:var(--accent-dim);border:1px solid var(--accent-mid);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:1.1rem;cursor:pointer;flex-shrink:0;">
                <ion-icon name="send"></ion-icon>
            </button>
        </form>
    </div>
</div>

<!-- Day entries modal -->
<div class="overlay-glass" id="day-entries-modal">
    <div class="glass-pane" style="text-align:center;max-width:400px;display:flex;flex-direction:column;max-height:80dvh;">
        <h3 class="serif-header" id="modal-date-header" style="font-size:1.3rem;margin-bottom:12px;">Memories</h3>
        <div id="day-summary-box" style="background:var(--surface-2);padding:12px;border-radius:var(--r-sm);font-size:0.88rem;font-style:italic;line-height:1.55;margin-bottom:12px;border:1px solid var(--border);text-align:left;color:var(--text-2);"></div>
        <div id="day-entries-list" style="display:flex;flex-direction:column;gap:8px;overflow-y:auto;"></div>
        <button class="btn-solid" style="margin-top:16px;" onclick="document.getElementById('day-entries-modal').classList.remove('active')">Close</button>
    </div>
</div>

<!-- Music Picker Modal -->
<div class="overlay-glass" id="music-picker-modal" style="z-index:10000;">
    <div class="glass-pane" style="width:100%;max-width:460px;max-height:85dvh;display:flex;flex-direction:column;padding:0;overflow:hidden;">
        <div style="padding:16px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="#1DB954">
                <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
            </svg>
            <h3 style="margin:0;font-size:1rem;font-weight:600;">Add Music</h3>
            <button class="mobile-menu-btn" style="margin-left:auto;" onclick="document.getElementById('music-picker-modal').classList.remove('active')">
                <ion-icon name="close-outline"></ion-icon>
            </button>
        </div>
        <div id="music-tabs" style="display:flex;border-bottom:1px solid var(--border);flex-shrink:0;">
            <button class="music-tab active" data-tab="search" onclick="window.switchMusicTab('search')">Search</button>
            <button class="music-tab" id="music-tab-recent"    data-tab="recent"    onclick="window.switchMusicTab('recent')"    style="display:none;">Recent</button>
            <button class="music-tab" id="music-tab-playlists" data-tab="playlists" onclick="window.switchMusicTab('playlists')" style="display:none;">Playlists</button>
        </div>
        <div id="music-search-bar" style="padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0;">
            <input type="text" id="music-search-input" class="minimal-input"
                placeholder="Search songs, artists…"
                style="margin:0;border-radius:var(--r-sm);padding:10px 14px;background:var(--surface-2);font-size:16px;">
        </div>
        <div id="music-results" style="flex:1;overflow-y:auto;padding:6px;-webkit-overflow-scrolling:touch;">
            <div style="text-align:center;padding:32px 20px;color:var(--text-3);">
                <ion-icon name="musical-notes-outline" style="font-size:1.8rem;display:block;margin-bottom:8px;opacity:0.4;"></ion-icon>
                Search for a song to attach
            </div>
        </div>
        <div id="music-connect-nudge" style="padding:12px;border-top:1px solid var(--border);text-align:center;font-size:0.8rem;color:var(--text-2);display:none;">
            <a href="#" onclick="window.initiateSpotifyAuth();return false;" style="color:#1DB954;font-weight:600;">Connect Spotify</a>
            for Recently Played &amp; Playlists
        </div>
    </div>
</div>

<!-- Spotify embed modal -->
<div class="overlay-glass" id="spotify-embed-modal" style="z-index:10001;">
    <div class="glass-pane" style="width:100%;max-width:420px;padding:20px;">
        <button class="mobile-menu-btn" style="margin-left:auto;display:flex;"
            onclick="document.getElementById('spotify-embed-modal').classList.remove('active');document.getElementById('spotify-embed-frame').src=''">
            <ion-icon name="close-outline"></ion-icon>
        </button>
        <iframe id="spotify-embed-frame" src="" width="100%" height="152" frameborder="0"
            allow="autoplay;clipboard-write;encrypted-media;fullscreen;picture-in-picture"
            loading="lazy" style="border-radius:var(--r-sm);margin-top:8px;"></iframe>
    </div>
</div>

<script src="sidebar-common.js"></script>
<script src="journal.js"></script>
<script src="spotify-auth.js"></script>
<script src="profile-manager.js"></script>
<script src="nav-bar.js"></script>
</body>
</html>
