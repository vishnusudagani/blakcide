# Supabase config — Edge Functions for Blak on WhatsApp.
#
# The webhook is called UNAUTHENTICATED by Meta (no Supabase JWT). We do NOT
# verify a JWT; instead the function verifies Meta's X-Hub-Signature-256 itself.
# The proactive function is guarded by a CRON_SECRET header.

project_id = "T2MWEB"

[functions.blak-whatsapp]
verify_jwt = false

[functions.blak-proactive]
verify_jwt = false

# Spotify OAuth callback is hit by Spotify's redirect (no JWT) — identity comes
# from the HMAC-signed state, so the gateway must not require a JWT.
[functions.spotify-oauth-callback]
verify_jwt = false
